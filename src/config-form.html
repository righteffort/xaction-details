<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuration - Xaction Details</title>
  <link rel="stylesheet" href="config-form.css">
  <script type="module" src="./config-form.ts"></script>
</head>
<body>
  <fieldset id="formFieldset" disabled>
    <fieldset class="form-section">
      <legend>API Server Configuration</legend>
      <div class="field-row">
        <label for="serverUrl">API Server URL*</label>
        <input class="field-input" type="url" id="serverUrl" required>
      </div>
      <div class="field-row">
        <label for="apiKey">API Server API key*</label>
        <input class="field-input" type="password" id="apiKey" required>
      </div>
      <fieldset class="form-subsection">
        <legend>Custom headers for API Server requests</legend>
        <div id="headerList" class="header-list"></div>
        <button type="button" id="addHeaderButton">Add header</button>
      </fieldset>
    </fieldset>

    <fieldset class="form-section">
      <legend>Actual Budget Configuration</legend>
      <div class="field-row">
        <label for="encryptionKey">Actual Budget encryption key</label>
        <input class="field-input" type="password" id="encryptionKey">
      </div>
      <div class="field-row">
        <label for="syncId">Actual Budget sync ID*</label>
        <input class="field-input" id="syncId" required>
      </div>
      <div class="field-row">
        <label for="chaseAccountId">Actual Budget Chase Account ID*</label>
        <input class="field-input" id="chaseAccountId" required>
      </div>
    </fieldset>

    <fieldset class="form-section">
      <legend>Extension configuration</legend>
      <div class="field-row">
        <label for="historyRetentionDays">History Retention (days)*</label>
        <input class="field-input field-input--narrow" type="number" id="historyRetentionDays" min="1" required>
      </div>
      <fieldset class="form-subsection">
        <legend>Enable the extension on the following sites:</legend>
        <div id="enabledSiteList"></div>
      </fieldset>
    </fieldset>

    <button type="button" id="saveButton">Save</button>
  </fieldset>
  <div id="status"></div>

  <template id="headerEntryTemplate">
    <div class="header-entry">
      <label class="header-key-label" for="header">Header</label>
      <input class="field-input header-key-input" id="header"/>
      <label class="header-value-label" for="value">Value</label>
      <input class="field-input header-value-input" type="password" id="value"/>
      <button type="button" aria-label="Delete header" class="delete-btn">
        <svg width="24" height="24" viewBox="2 2 22 22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <g transform="translate(0, -1)">
            <path d="M4 7h16"/>
            <path d="M6 7v13a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7"/>
            <path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/>
            <line x1="10" y1="11" x2="10" y2="17"/>
            <line x1="14" y1="11" x2="14" y2="17"/>
          </g>
        </svg>
      </button>
    </div>
  </template>
</body>
</html>
